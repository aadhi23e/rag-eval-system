[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aadhi23e", email = "aadhi23e@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepeval>=4.2.8",
    "dotenv>=0.9.9",
    "langchain>=1.4.4",
    "langchain-google-genai>=4.4.1",
    "langchain-groq>=1.1.3",
    "numpy>=2.4.6",
    "pydantic>=2.14.0",
    "pymupdf>=1.28.2",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
